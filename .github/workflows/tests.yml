name: Oracle A1 Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-capacity
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OCI_REGION: ap-batam-1
      OCI_IMAGE_ID: ocid1.image.oc1.ap-batam-1.aaaaaaaawggpxox66i2n3l5mvy2fvh5i3z762k4d2vzxxd3ezygzgl5i5iqa
      OCI_SHAPE: VM.Standard.A1.Flex

    steps:
      - name: Validate Secrets
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          FAILED=0

          for VAR in \
            OCI_KEY_CONTENT \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_SUBNET_ID \
            OCI_SSH_PUBLIC_KEY
          do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR kosong."
              FAILED=1
            else
              echo "OK: $VAR tersedia."
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Create OCI Credentials
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > "$HOME/.oci/server_ssh_key.pub"
          chmod 600 "$HOME/.oci/server_ssh_key.pub"

      - name: Install OCI CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-cli"

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet --upgrade pip

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet oci-cli

          "$RUNNER_TEMP/oci-cli/bin/oci" --version

      - name: Verify OCI Connection
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Checking Oracle API authentication..."

          "$OCI" iam user get \
            --user-id "$OCI_USER_OCID" \
            --output json >/dev/null

          "$OCI" compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region "$OCI_REGION" \
            --limit 1 \
            --output json >/dev/null

          echo "SUCCESS: Oracle API dan Compute Batam dapat diakses."

      - name: Check Existing A1 Instance
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          "$OCI" compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region "$OCI_REGION" \
            --all \
            --output json > "$RUNNER_TEMP/instances.json"

          COUNT=$(python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "instances.json"
          )

          with open(path, "r") as f:
              data = json.load(f).get("data", [])

          instances = [
              x for x in data
              if x.get("shape") == "VM.Standard.A1.Flex"
              and x.get("lifecycle-state") != "TERMINATED"
          ]

          print(len(instances))
          PY
          )

          echo "Jumlah A1 aktif/provisioning: $COUNT"

          if [ "$COUNT" -ge 1 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A1 sudah ada. Tidak membuat instance kedua."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Belum ada A1. Akan mencoba membuat."
          fi

      - name: Get Availability Domain
        id: ad
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          AD=$(
            "$OCI" iam availability-domain list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --query 'data[0].name' \
              --raw-output
          )

          if [ -z "$AD" ] || [ "$AD" = "null" ]; then
            echo "ERROR: Availability Domain tidak ditemukan."
            exit 1
          fi

          echo "Availability Domain ditemukan."
          echo "ad=$AD" >> "$GITHUB_OUTPUT"

      - name: Try Create Oracle A1
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"
          AD="${{ steps.ad.outputs.ad }}"

          NAME="free-a1-$(date +%Y%m%d-%H%M)"

          echo "========================================"
          echo "Mencoba membuat Oracle A1"
          echo "Region : $OCI_REGION"
          echo "Shape  : $OCI_SHAPE"
          echo "OCPU   : 1"
          echo "RAM    : 6 GB"
          echo "========================================"

          set +e

          "$OCI" compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$OCI_IMAGE_ID" \
            --shape "$OCI_SHAPE" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --display-name "$NAME" \
            --ssh-authorized-keys-file "$HOME/.oci/server_ssh_key.pub" \
            --assign-public-ip true \
            --boot-volume-size-in-gbs 50 \
            --wait-for-state RUNNING \
            --wait-interval-seconds 10 \
            --max-wait-seconds 600 \
            --output json \
            > "$RUNNER_TEMP/launch.json" \
            2> "$RUNNER_TEMP/launch-error.txt"

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            ERROR_TEXT=$(cat "$RUNNER_TEMP/launch-error.txt")

            echo "$ERROR_TEXT"

            if echo "$ERROR_TEXT" | grep -qiE \
              'Out of host capacity|Out of capacity'; then

              echo ""
              echo "========================================"
              echo "STOK A1 BATAM MASIH HABIS"
              echo "Workflow akan mencoba lagi pada jadwal berikutnya."
              echo "========================================"

              exit 0
            fi

            echo ""
            echo "ERROR bukan masalah kapasitas."
            exit "$STATUS"
          fi

          echo ""
          echo "========================================"
          echo "SERVER BERHASIL DIBUAT!"
          echo "========================================"

          cat "$RUNNER_TEMP/launch.json"

          INSTANCE_ID=$(python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "launch.json"
          )

          with open(path, "r") as f:
              obj = json.load(f)

          print(obj["data"]["id"])
          PY
          )

          echo ""
          echo "Instance OCID berhasil didapat."

          VNIC_ID=$(
            "$OCI" compute vnic-attachment list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --instance-id "$INSTANCE_ID" \
              --query 'data[0]."vnic-id"' \
              --raw-output
          )

          PUBLIC_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --query 'data."public-ip"' \
              --raw-output
          )

          echo ""
          echo "========================================"
          echo "ORACLE A1 BERHASIL RUNNING"
          echo "Public IP: $PUBLIC_IP"
          echo "========================================"
