name: Oracle A1 Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-capacity
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OCI_REGION: ap-batam-1
      OCI_SHAPE: VM.Standard.A1.Flex
      OCI_OCPUS: "1"
      OCI_MEMORY_GB: "6"
      OCI_BOOT_GB: "50"

    steps:
      - name: Validate Secrets
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -e
          for VAR in OCI_KEY_CONTENT OCI_USER_OCID OCI_TENANCY_OCID OCI_FINGERPRINT OCI_SUBNET_ID OCI_SSH_PUBLIC_KEY; do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR kosong."
              exit 1
            fi
          done
          echo "Semua secret tersedia."

      - name: Prepare OCI CLI
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          set -e
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<CFG
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          CFG
          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > "$HOME/.oci/server_ssh_key.pub"
          chmod 600 "$HOME/.oci/server_ssh_key.pub"

          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/oci-cli/bin/pip" install --quiet oci-cli
          "$RUNNER_TEMP/oci-cli/bin/oci" --version

      - name: Smart Capacity Check and Launch
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          set -e
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Checking Oracle authentication..."
          "$OCI" iam user get \
            --user-id "$OCI_USER_OCID" \
            --output json \
            --connection-timeout 30 \
            --read-timeout 60 \
            --max-retries 0 >/dev/null
          echo "Authentication OK."

          # Beri jeda kecil antar request agar tidak menembak API bertubi-tubi.
          sleep 2

          # --------------------------------------------------------
          # CEK INSTANCE A1 YANG SUDAH ADA
          # --------------------------------------------------------
          COUNT=$(
            "$OCI" compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --limit 100 \
              --query 'length(data[?shape==`"VM.Standard.A1.Flex"` && "lifecycle-state"!=`"TERMINATED"`])' \
              --raw-output \
              --connection-timeout 30 \
              --read-timeout 60 \
              --max-retries 0
          )

          [ -z "$COUNT" ] && COUNT=0
          [ "$COUNT" = "null" ] && COUNT=0
          echo "Jumlah A1 aktif/provisioning: $COUNT"

          if [ "$COUNT" -ge 1 ]; then
            echo "========================================"
            echo "A1 SUDAH ADA"
            echo "Tidak membuat instance kedua."
            echo "========================================"
            exit 0
          fi

          echo "========================================"
          echo "BELUM ADA A1"
          echo "Akan mengecek kapasitas lebih dulu."
          echo "========================================"

          sleep 2

          # --------------------------------------------------------
          # AMBIL DATA SUBNET SEKALI SAJA
          # --------------------------------------------------------
          "$OCI" network subnet get \
            --subnet-id "$OCI_SUBNET_ID" \
            --region "$OCI_REGION" \
            --output json \
            --connection-timeout 30 \
            --read-timeout 60 \
            --max-retries 0 > "$RUNNER_TEMP/subnet.json"

          python3 - <<'PY' > "$RUNNER_TEMP/subnet.env"
          import json, os, shlex
          p = os.path.join(os.environ['RUNNER_TEMP'], 'subnet.json')
          d = json.load(open(p, encoding='utf-8')).get('data', {})
          for k, v in {
              'SUBNET_NAME': d.get('display-name', ''),
              'SUBNET_AD': d.get('availability-domain') or '',
              'PRIVATE_SUBNET': d.get('prohibit-public-ip-on-vnic', '')
          }.items():
              print(f"{k}={shlex.quote(str(v))}")
          PY
          source "$RUNNER_TEMP/subnet.env"

          echo "Subnet: $SUBNET_NAME"
          echo "Private subnet: $PRIVATE_SUBNET"

          if [ -n "$SUBNET_AD" ]; then
            AD="$SUBNET_AD"
          else
            sleep 2
            AD=$(
              "$OCI" iam availability-domain list \
                --compartment-id "$OCI_TENANCY_OCID" \
                --region "$OCI_REGION" \
                --query 'data[0].name' \
                --raw-output \
                --connection-timeout 30 \
                --read-timeout 60 \
                --max-retries 0
            )
          fi

          if [ -z "$AD" ] || [ "$AD" = "null" ]; then
            echo "ERROR: Availability Domain tidak ditemukan."
            exit 1
          fi

          echo "Availability Domain: $AD"
          sleep 2

          # --------------------------------------------------------
          # CAPACITY REPORT: CEK STOK SEBELUM LAUNCH
          # --------------------------------------------------------
          SHAPE_JSON=$(printf \
            '[{"instanceShape":"%s","instanceShapeConfig":{"ocpus":%s,"memoryInGBs":%s}}]' \
            "$OCI_SHAPE" "$OCI_OCPUS" "$OCI_MEMORY_GB")

          set +e
          "$OCI" compute compute-capacity-report create \
            --availability-domain "$AD" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --shape-availabilities "$SHAPE_JSON" \
            --region "$OCI_REGION" \
            --output json \
            --connection-timeout 30 \
            --read-timeout 90 \
            --max-retries 0 \
            > "$RUNNER_TEMP/capacity.json" \
            2> "$RUNNER_TEMP/capacity-error.txt"
          CAP_RC=$?
          set -e

          if [ "$CAP_RC" -ne 0 ]; then
            ERR=$(cat "$RUNNER_TEMP/capacity-error.txt")
            echo "$ERR"

            if echo "$ERR" | grep -qiE 'TooManyRequests|429'; then
              echo "========================================"
              echo "ORACLE RATE LIMIT"
              echo "========================================"
              echo "Capacity report kena 429. Tidak melakukan launch."
              exit 0
            fi

            echo "========================================"
            echo "ERROR CAPACITY REPORT"
            echo "========================================"
            exit "$CAP_RC"
          fi

          python3 - <<'PY' > "$RUNNER_TEMP/capacity.env"
          import json, os, shlex
          p = os.path.join(os.environ['RUNNER_TEMP'], 'capacity.json')
          d = json.load(open(p, encoding='utf-8')).get('data', {})
          items = d.get('shape-availabilities') or d.get('shapeAvailabilities') or []
          status = ''
          count = 0
          if items:
              x = items[0]
              status = x.get('availability-status') or x.get('availabilityStatus') or ''
              count = x.get('available-count')
              if count is None:
                  count = x.get('availableCount', 0)
          try:
              count = int(count or 0)
          except Exception:
              count = 0
          print('CAPACITY_STATUS=' + shlex.quote(str(status)))
          print('AVAILABLE_COUNT=' + shlex.quote(str(count)))
          PY
          source "$RUNNER_TEMP/capacity.env"

          echo "Capacity status: $CAPACITY_STATUS"
          echo "Available count: $AVAILABLE_COUNT"

          if [ "$CAPACITY_STATUS" = "OUT_OF_HOST_CAPACITY" ] || [ "$AVAILABLE_COUNT" -lt 1 ]; then
            echo "========================================"
            echo "STOK A1 BATAM MASIH HABIS"
            echo "========================================"
            echo "Tidak melakukan launch. Akan dicek lagi otomatis."
            exit 0
          fi

          if [ "$CAPACITY_STATUS" != "AVAILABLE" ]; then
            echo "========================================"
            echo "STATUS KAPASITAS TIDAK DIKENALI"
            echo "========================================"
            echo "Tidak melakukan launch untuk keamanan."
            exit 0
          fi

          echo "========================================"
          echo "KAPASITAS A1 TERSEDIA"
          echo "Available count: $AVAILABLE_COUNT"
          echo "========================================"

          sleep 2

          # --------------------------------------------------------
          # CARI IMAGE ARM TERBARU, SATU API CALL
          # --------------------------------------------------------
          "$OCI" compute image list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region "$OCI_REGION" \
            --operating-system "Oracle Linux" \
            --shape "$OCI_SHAPE" \
            --lifecycle-state AVAILABLE \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --limit 1 \
            --output json \
            --connection-timeout 30 \
            --read-timeout 60 \
            --max-retries 0 > "$RUNNER_TEMP/image.json"

          python3 - <<'PY' > "$RUNNER_TEMP/image.env"
          import json, os, shlex
          p = os.path.join(os.environ['RUNNER_TEMP'], 'image.json')
          items = json.load(open(p, encoding='utf-8')).get('data', [])
          x = items[0] if items else {}
          print('IMAGE_ID=' + shlex.quote(str(x.get('id', ''))))
          print('IMAGE_NAME=' + shlex.quote(str(x.get('display-name', ''))))
          PY
          source "$RUNNER_TEMP/image.env"

          if [ -z "$IMAGE_ID" ]; then
            echo "ERROR: Image ARM kompatibel tidak ditemukan."
            exit 1
          fi

          echo "Image: $IMAGE_NAME"
          sleep 2

          # --------------------------------------------------------
          # LAUNCH SEKALI SAJA, TANPA RETRY CEPAT
          # --------------------------------------------------------
          NAME="free-a1-$(date +%Y%m%d-%H%M%S)"

          echo "========================================"
          echo "MENCOBA MEMBUAT ORACLE A1"
          echo "Region : $OCI_REGION"
          echo "AD     : $AD"
          echo "Shape  : $OCI_SHAPE"
          echo "OCPU   : $OCI_OCPUS"
          echo "RAM    : $OCI_MEMORY_GB GB"
          echo "Boot   : $OCI_BOOT_GB GB"
          echo "Image  : $IMAGE_NAME"
          echo "Name   : $NAME"
          echo "========================================"

          set +e
          "$OCI" compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --shape "$OCI_SHAPE" \
            --shape-config "{\"ocpus\":$OCI_OCPUS,\"memoryInGBs\":$OCI_MEMORY_GB}" \
            --display-name "$NAME" \
            --ssh-authorized-keys-file "$HOME/.oci/server_ssh_key.pub" \
            --boot-volume-size-in-gbs "$OCI_BOOT_GB" \
            --output json \
            --connection-timeout 30 \
            --read-timeout 180 \
            --max-retries 0 \
            > "$RUNNER_TEMP/launch.json" \
            2> "$RUNNER_TEMP/launch-error.txt"
          LAUNCH_RC=$?
          set -e

          if [ "$LAUNCH_RC" -ne 0 ]; then
            ERR=$(cat "$RUNNER_TEMP/launch-error.txt")
            echo "$ERR"

            if echo "$ERR" | grep -qiE 'TooManyRequests|429'; then
              echo "========================================"
              echo "ORACLE RATE LIMIT"
              echo "========================================"
              echo "Tidak retry cepat. Akan dicoba lagi pada jadwal berikutnya."
              exit 0
            fi

            if echo "$ERR" | grep -qiE 'Out of host capacity|Out of capacity|OutOfHostCapacity|OutOfCapacity'; then
              echo "========================================"
              echo "STOK A1 BATAM MASIH HABIS"
              echo "========================================"
              echo "Kapasitas berubah sebelum launch."
              exit 0
            fi

            echo "========================================"
            echo "ERROR OCI TIDAK DIKENALI"
            echo "========================================"
            exit "$LAUNCH_RC"
          fi

          INSTANCE_ID=$(python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'launch.json')
          print(json.load(open(p, encoding='utf-8')).get('data', {}).get('id', ''))
          PY
          )

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: Instance OCID tidak ditemukan dari response launch."
            exit 1
          fi

          echo "Launch request diterima Oracle."

          # --------------------------------------------------------
          # TUNGGU SAMPAI RUNNING
          # --------------------------------------------------------
          STATE=""
          for TRY in $(seq 1 30); do
            sleep 10
            set +e
            STATE=$(
              "$OCI" compute instance get \
                --instance-id "$INSTANCE_ID" \
                --region "$OCI_REGION" \
                --query 'data."lifecycle-state"' \
                --raw-output \
                --connection-timeout 30 \
                --read-timeout 60 \
                --max-retries 0 2>/dev/null
            )
            RC=$?
            set -e

            if [ "$RC" -ne 0 ]; then
              echo "Check $TRY/30: koneksi sementara gagal."
              continue
            fi

            echo "Check $TRY/30: $STATE"
            [ "$STATE" = "RUNNING" ] && break

            if [ "$STATE" = "TERMINATED" ] || [ "$STATE" = "TERMINATING" ]; then
              echo "Instance gagal provisioning."
              exit 1
            fi
          done

          if [ "$STATE" != "RUNNING" ]; then
            echo "Instance sudah dibuat tetapi belum RUNNING."
            echo "Run berikutnya akan mendeteksinya dan tidak membuat kedua."
            exit 0
          fi

          sleep 2

          VNIC_ID=$(
            "$OCI" compute vnic-attachment list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --instance-id "$INSTANCE_ID" \
              --region "$OCI_REGION" \
              --query 'data[0]."vnic-id"' \
              --raw-output \
              --connection-timeout 30 \
              --read-timeout 60 \
              --max-retries 0
          )

          sleep 2

          PRIVATE_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --region "$OCI_REGION" \
              --query 'data."private-ip"' \
              --raw-output \
              --connection-timeout 30 \
              --read-timeout 60 \
              --max-retries 0
          )

          sleep 2

          PUBLIC_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --region "$OCI_REGION" \
              --query 'data."public-ip"' \
              --raw-output \
              --connection-timeout 30 \
              --read-timeout 60 \
              --max-retries 0 2>/dev/null || true
          )

          [ "$PUBLIC_IP" = "null" ] && PUBLIC_IP=""
          [ "$PUBLIC_IP" = "None" ] && PUBLIC_IP=""

          echo "========================================"
          echo "ORACLE A1 BERHASIL RUNNING"
          echo "========================================"
          echo "Instance   : $NAME"
          echo "Image      : $IMAGE_NAME"
          echo "Shape      : $OCI_SHAPE"
          echo "OCPU       : $OCI_OCPUS"
          echo "RAM        : $OCI_MEMORY_GB GB"
          echo "Private IP : $PRIVATE_IP"

          if [ -n "$PUBLIC_IP" ]; then
            echo "Public IP  : $PUBLIC_IP"
          else
            echo "Public IP  : belum tersedia"
          fi

          echo "========================================"
