name: Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCI_REGION: ap-batam-1
      OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY_FILENAME: private_key.pem
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      OCI_IMAGE_ID: ocid1.image.oc1.ap-batam-1.aaaaaaaawggpxox66i2n3l5mvy2fvh5i3z762k4d2vzxxd3ezygzgl5i5iqa
      OCI_SSH_PUBLIC_KEY: ~/.ssh/id_rsa.pub
      OCI_OCPUS: 2
      OCI_MEMORY_IN_GBS: 12
      OCI_MAX_INSTANCES: 1
      OCI_SHAPE: VM.Standard.A1.Flex
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup SSH Keys
        run: ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N ""

      - name: Create Private Key File
        run: |
          echo "${{ secrets.OCI_KEY_CONTENT }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Execute OCI ARM Check
        run: php index.php
