name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate Required Secrets
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          FAILED=0

          for VAR in \
            OCI_KEY_CONTENT \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_SUBNET_ID \
            OCI_SSH_PUBLIC_KEY
          do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR kosong."
              FAILED=1
            else
              echo "OK: $VAR tersedia."
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Create OCI Private Key File
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          printf '%s\n' "$OCI_KEY_CONTENT" > "$GITHUB_WORKSPACE/private_key.pem"
          chmod 600 "$GITHUB_WORKSPACE/private_key.pem"

      - name: Validate OCI API Key Pair
        env:
          EXPECTED_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          ACTUAL=$(openssl rsa \
            -pubout \
            -outform DER \
            -in "$GITHUB_WORKSPACE/private_key.pem" \
            2>/dev/null \
            | openssl md5 -c \
            | sed 's/^.*= //' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          if [ -z "$ACTUAL" ]; then
            echo "ERROR: Private key tidak dapat dibaca."
            exit 1
          fi

          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "OK: Private key cocok dengan fingerprint."
          else
            echo "ERROR: Private key TIDAK cocok dengan fingerprint."
            exit 1
          fi

      # TES RESMI MENGGUNAKAN OCI CLI
      - name: Install OCI CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/oci-cli/bin/pip" install --quiet oci-cli

      - name: Create OCI CLI Config
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          mkdir -p "$HOME/.oci"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=ap-batam-1
          key_file=$GITHUB_WORKSPACE/private_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

      - name: Test 1 - OCI API Authentication
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Menguji User OCID + API Key..."

          "$OCI" iam user get \
            --user-id "$OCI_USER_OCID" \
            --output json >/dev/null

          echo "SUCCESS: API Key dan User OCID diterima Oracle."

      - name: Test 2 - Compute API Batam
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Menguji akses Compute di Batam..."

          "$OCI" compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region ap-batam-1 \
            --limit 1 \
            --output json >/dev/null

          echo "SUCCESS: Compute API Batam dapat diakses."

      - name: Execute OCI ARM Check
        env:
          OCI_REGION: ap-batam-1

          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: ${{ github.workspace }}/private_key.pem

          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}

          OCI_IMAGE_ID: ocid1.image.oc1.ap-batam-1.aaaaaaaawggpxox66i2n3l5mvy2fvh5i3z762k4d2vzxxd3ezygzgl5i5iqa

          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}

          OCI_OCPUS: "1"
          OCI_MEMORY_IN_GBS: "6"
          OCI_MAX_INSTANCES: "1"
          OCI_SHAPE: VM.Standard.A1.Flex

        run: php index.php
