name: Oracle A1 Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-capacity
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OCI_REGION: ap-batam-1
      OCI_IMAGE_ID: ocid1.image.oc1.ap-batam-1.aaaaaaaawggpxox66i2n3l5mvy2fvh5i3z762k4d2vzxxd3ezygzgl5i5iqa
      OCI_SHAPE: VM.Standard.A1.Flex

    steps:

      # ============================================================
      # 1. VALIDASI SECRET
      # ============================================================

      - name: Validate Secrets
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          FAILED=0

          for VAR in \
            OCI_KEY_CONTENT \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_SUBNET_ID \
            OCI_SSH_PUBLIC_KEY
          do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR kosong."
              FAILED=1
            else
              echo "OK: $VAR tersedia."
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ============================================================
      # 2. BUAT CREDENTIAL OCI
      # ============================================================

      - name: Create OCI Credentials
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" \
            > "$HOME/.oci/server_ssh_key.pub"

          chmod 600 "$HOME/.oci/server_ssh_key.pub"

      # ============================================================
      # 3. INSTALL OCI CLI
      # ============================================================

      - name: Install OCI CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-cli"

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet --upgrade pip

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet oci-cli

          echo "OCI CLI version:"
          "$RUNNER_TEMP/oci-cli/bin/oci" --version

      # ============================================================
      # 4. TEST KONEKSI ORACLE
      # ============================================================

      - name: Verify OCI Connection
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Checking Oracle API authentication..."

          "$OCI" iam user get \
            --user-id "$OCI_USER_OCID" \
            --output json \
            >/dev/null

          echo "API authentication OK."

          echo "Checking Compute API Batam..."

          "$OCI" compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region "$OCI_REGION" \
            --limit 1 \
            --output json \
            >/dev/null

          echo "SUCCESS: Oracle API dan Compute Batam dapat diakses."

      # ============================================================
      # 5. CEK APAKAH SUDAH ADA A1
      # ============================================================

      - name: Check Existing A1 Instance
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Mengecek apakah A1 sudah ada..."

          COUNT=$(
            "$OCI" compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --limit 100 \
              --query 'length(data[?shape==`"VM.Standard.A1.Flex"` && "lifecycle-state"!=`"TERMINATED"`])' \
              --raw-output
          )

          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
            COUNT=0
          fi

          echo "Jumlah A1 aktif/provisioning: $COUNT"

          if [ "$COUNT" -ge 1 ]; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "========================================"
            echo "A1 SUDAH ADA"
            echo "Tidak akan membuat instance kedua."
            echo "========================================"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "========================================"
            echo "BELUM ADA A1"
            echo "Akan mencoba membuat instance."
            echo "========================================"

          fi

      # ============================================================
      # 6. AMBIL AVAILABILITY DOMAIN
      # ============================================================

      - name: Get Availability Domain
        id: ad
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Mencari Availability Domain..."

          AD=$(
            "$OCI" iam availability-domain list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --query 'data[0].name' \
              --raw-output
          )

          if [ -z "$AD" ] || [ "$AD" = "null" ]; then
            echo "ERROR: Availability Domain tidak ditemukan."
            exit 1
          fi

          echo "Availability Domain ditemukan:"
          echo "$AD"

          echo "ad=$AD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. COBA BUAT A1
      # ============================================================

      - name: Try Create Oracle A1
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          AD="${{ steps.ad.outputs.ad }}"

          NAME="free-a1-$(date +%Y%m%d-%H%M)"

          echo ""
          echo "========================================"
          echo "MENCOBA MEMBUAT ORACLE A1"
          echo "========================================"
          echo "Region : $OCI_REGION"
          echo "AD     : $AD"
          echo "Shape  : $OCI_SHAPE"
          echo "OCPU   : 1"
          echo "RAM    : 6 GB"
          echo "Boot   : 50 GB"
          echo "Name   : $NAME"
          echo "========================================"
          echo ""

          set +e

          "$OCI" compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$OCI_IMAGE_ID" \
            --shape "$OCI_SHAPE" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --display-name "$NAME" \
            --ssh-authorized-keys-file "$HOME/.oci/server_ssh_key.pub" \
            --boot-volume-size-in-gbs 50 \
            --wait-for-state RUNNING \
            --wait-interval-seconds 10 \
            --max-wait-seconds 600 \
            --output json \
            > "$RUNNER_TEMP/launch.json" \
            2> "$RUNNER_TEMP/launch-error.txt"

          STATUS=$?

          set -e

          # ========================================================
          # JIKA GAGAL
          # ========================================================

          if [ "$STATUS" -ne 0 ]; then

            ERROR_TEXT=$(cat "$RUNNER_TEMP/launch-error.txt")

            echo ""
            echo "Response Oracle:"
            echo "$ERROR_TEXT"
            echo ""

            if echo "$ERROR_TEXT" | grep -qiE \
              'Out of host capacity|Out of capacity'; then

              echo "========================================"
              echo "STOK A1 BATAM MASIH HABIS"
              echo "========================================"
              echo ""
              echo "Tidak ada kesalahan konfigurasi."
              echo "Workflow akan mencoba lagi otomatis."
              echo ""

              exit 0

            fi

            if echo "$ERROR_TEXT" | grep -qi \
              'LimitExceeded'; then

              echo "========================================"
              echo "LIMIT ORACLE SUDAH TERCAPAI"
              echo "========================================"

              exit 1

            fi

            if echo "$ERROR_TEXT" | grep -qi \
              'InvalidParameter'; then

              echo "========================================"
              echo "ADA PARAMETER ORACLE YANG TIDAK VALID"
              echo "Kemungkinan IMAGE / SUBNET / SHAPE."
              echo "========================================"

              exit 1

            fi

            echo "========================================"
            echo "ERROR BUKAN MASALAH KAPASITAS"
            echo "========================================"

            exit "$STATUS"

          fi

          # ========================================================
          # BERHASIL
          # ========================================================

          echo ""
          echo "========================================"
          echo "SERVER BERHASIL DIBUAT!"
          echo "========================================"

          INSTANCE_ID=$(
            python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "launch.json"
          )

          with open(path, "r") as f:
              obj = json.load(f)

          print(obj["data"]["id"])
          PY
          )

          if [ -z "$INSTANCE_ID" ]; then
            echo "Instance dibuat tetapi OCID tidak ditemukan."
            exit 1
          fi

          echo "Instance OCID berhasil didapat."

          # ========================================================
          # AMBIL VNIC
          # ========================================================

          VNIC_ID=$(
            "$OCI" compute vnic-attachment list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --instance-id "$INSTANCE_ID" \
              --query 'data[0]."vnic-id"' \
              --raw-output
          )

          echo "VNIC berhasil ditemukan."

          # ========================================================
          # AMBIL PUBLIC IP
          # ========================================================

          PUBLIC_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --query 'data."public-ip"' \
              --raw-output
          )

          PRIVATE_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --query 'data."private-ip"' \
              --raw-output
          )

          echo ""
          echo "========================================"
          echo "🎉 ORACLE A1 BERHASIL RUNNING"
          echo "========================================"
          echo "Instance : $NAME"
          echo "OCPU     : 1"
          echo "RAM      : 6 GB"
          echo "Shape    : $OCI_SHAPE"
          echo "Private IP: $PRIVATE_IP"
          echo "Public IP : $PUBLIC_IP"
          echo "========================================"
