name: Oracle A1 Auto Provision

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-capacity
  cancel-in-progress: false

jobs:
  create-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      OCI_REGION: ap-batam-1
      OCI_SHAPE: VM.Standard.A1.Flex
      OCI_OCPUS: "1"
      OCI_MEMORY_GB: "6"
      OCI_BOOT_GB: "50"

    steps:
      # ============================================================
      # 1. VALIDASI SECRET
      # ============================================================

      - name: Validate Secrets
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          FAILED=0

          for VAR in \
            OCI_KEY_CONTENT \
            OCI_USER_OCID \
            OCI_TENANCY_OCID \
            OCI_FINGERPRINT \
            OCI_SUBNET_ID \
            OCI_SSH_PUBLIC_KEY
          do
            if [ -z "${!VAR}" ]; then
              echo "ERROR: $VAR kosong."
              FAILED=1
            else
              echo "OK: $VAR tersedia."
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      # ============================================================
      # 2. BUAT CREDENTIAL OCI
      # ============================================================

      - name: Create OCI Credentials
        env:
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" \
            > "$HOME/.oci/server_ssh_key.pub"

          chmod 600 "$HOME/.oci/server_ssh_key.pub"

      # ============================================================
      # 3. INSTALL OCI CLI
      # ============================================================

      - name: Install OCI CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-cli"

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet --upgrade pip

          "$RUNNER_TEMP/oci-cli/bin/pip" \
            install --quiet oci-cli

          echo "OCI CLI version:"
          "$RUNNER_TEMP/oci-cli/bin/oci" --version

      # ============================================================
      # 4. TEST KONEKSI
      # ============================================================

      - name: Verify OCI Connection
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Checking Oracle authentication..."

          "$OCI" iam user get \
            --user-id "$OCI_USER_OCID" \
            --output json \
            >/dev/null

          echo "Authentication OK."

          "$OCI" compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --region "$OCI_REGION" \
            --limit 1 \
            --output json \
            >/dev/null

          echo "Compute API Batam OK."

      # ============================================================
      # 5. VALIDASI SUBNET
      # ============================================================

      - name: Validate OCI Subnet
        id: subnet
        env:
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Checking subnet..."

          "$OCI" network subnet get \
            --subnet-id "$OCI_SUBNET_ID" \
            --region "$OCI_REGION" \
            --output json \
            >/dev/null

          SUBNET_NAME=$(
            "$OCI" network subnet get \
              --subnet-id "$OCI_SUBNET_ID" \
              --region "$OCI_REGION" \
              --query 'data."display-name"' \
              --raw-output
          )

          SUBNET_AD=$(
            "$OCI" network subnet get \
              --subnet-id "$OCI_SUBNET_ID" \
              --region "$OCI_REGION" \
              --query 'data."availability-domain"' \
              --raw-output
          )

          PRIVATE_SUBNET=$(
            "$OCI" network subnet get \
              --subnet-id "$OCI_SUBNET_ID" \
              --region "$OCI_REGION" \
              --query 'data."prohibit-public-ip-on-vnic"' \
              --raw-output
          )

          if [ "$SUBNET_AD" = "None" ] || \
             [ "$SUBNET_AD" = "null" ]; then
            SUBNET_AD=""
          fi

          echo "Subnet ditemukan: $SUBNET_NAME"
          echo "Private subnet: $PRIVATE_SUBNET"

          if [ -n "$SUBNET_AD" ]; then
            echo "Subnet AD: $SUBNET_AD"
          else
            echo "Subnet bersifat regional."
          fi

          echo "subnet_ad=$SUBNET_AD" >> "$GITHUB_OUTPUT"
          echo "private_subnet=$PRIVATE_SUBNET" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. CEK INSTANCE A1 YANG SUDAH ADA
      # ============================================================

      - name: Check Existing A1 Instance
        id: existing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          COUNT=$(
            "$OCI" compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --limit 100 \
              --query 'length(data[?shape==`"VM.Standard.A1.Flex"` && "lifecycle-state"!=`"TERMINATED"`])' \
              --raw-output
          )

          if [ -z "$COUNT" ] || [ "$COUNT" = "null" ]; then
            COUNT=0
          fi

          echo "Jumlah A1 aktif/provisioning: $COUNT"

          if [ "$COUNT" -ge 1 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "========================================"
            echo "A1 SUDAH ADA"
            echo "Tidak membuat instance baru."
            echo "========================================"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "========================================"
            echo "BELUM ADA A1"
            echo "Workflow akan mencoba membuat."
            echo "========================================"
          fi

      # ============================================================
      # 7. PILIH AVAILABILITY DOMAIN
      # ============================================================

      - name: Get Availability Domain
        id: ad
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          SUBNET_AD="${{ steps.subnet.outputs.subnet_ad }}"

          if [ -n "$SUBNET_AD" ]; then

            AD="$SUBNET_AD"

            echo "Menggunakan AD dari subnet."

          else

            AD=$(
              "$OCI" iam availability-domain list \
                --compartment-id "$OCI_TENANCY_OCID" \
                --region "$OCI_REGION" \
                --query 'data[0].name' \
                --raw-output
            )

          fi

          if [ -z "$AD" ] || [ "$AD" = "null" ]; then
            echo "ERROR: Availability Domain tidak ditemukan."
            exit 1
          fi

          echo "Availability Domain: $AD"

          echo "ad=$AD" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. CARI IMAGE ARM TERBARU YANG KOMPATIBEL
      # ============================================================

      - name: Get Latest Compatible Oracle Linux Image
        id: image
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          echo "Mencari Oracle Linux terbaru untuk $OCI_SHAPE..."

          IMAGE_ID=$(
            "$OCI" compute image list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --operating-system "Oracle Linux" \
              --shape "$OCI_SHAPE" \
              --lifecycle-state AVAILABLE \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --limit 1 \
              --query 'data[0].id' \
              --raw-output
          )

          if [ -z "$IMAGE_ID" ] || \
             [ "$IMAGE_ID" = "null" ] || \
             [ "$IMAGE_ID" = "None" ]; then

            echo "ERROR: Image Oracle Linux kompatibel A1 tidak ditemukan."
            exit 1
          fi

          IMAGE_NAME=$(
            "$OCI" compute image get \
              --image-id "$IMAGE_ID" \
              --region "$OCI_REGION" \
              --query 'data."display-name"' \
              --raw-output
          )

          echo "Image ditemukan:"
          echo "$IMAGE_NAME"

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 9. COBA BUAT INSTANCE
      # ============================================================

      - name: Try Create Oracle A1
        if: steps.existing.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          OCI="$RUNNER_TEMP/oci-cli/bin/oci"

          AD="${{ steps.ad.outputs.ad }}"
          IMAGE_ID="${{ steps.image.outputs.image_id }}"
          IMAGE_NAME="${{ steps.image.outputs.image_name }}"

          NAME="free-a1-$(date +%Y%m%d-%H%M)"

          echo ""
          echo "========================================"
          echo "MENCOBA MEMBUAT ORACLE A1"
          echo "========================================"
          echo "Region : $OCI_REGION"
          echo "AD     : $AD"
          echo "Shape  : $OCI_SHAPE"
          echo "OCPU   : $OCI_OCPUS"
          echo "RAM    : $OCI_MEMORY_GB GB"
          echo "Boot   : $OCI_BOOT_GB GB"
          echo "Image  : $IMAGE_NAME"
          echo "Name   : $NAME"
          echo "========================================"
          echo ""

          set +e

          "$OCI" compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$OCI_TENANCY_OCID" \
            --subnet-id "$OCI_SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --shape "$OCI_SHAPE" \
            --shape-config "{\"ocpus\":$OCI_OCPUS,\"memoryInGBs\":$OCI_MEMORY_GB}" \
            --display-name "$NAME" \
            --ssh-authorized-keys-file "$HOME/.oci/server_ssh_key.pub" \
            --boot-volume-size-in-gbs "$OCI_BOOT_GB" \
            --wait-for-state RUNNING \
            --wait-interval-seconds 10 \
            --max-wait-seconds 600 \
            --output json \
            > "$RUNNER_TEMP/launch.json" \
            2> "$RUNNER_TEMP/launch-error.txt"

          STATUS=$?

          set -e

          # ========================================================
          # ERROR HANDLER
          # ========================================================

          if [ "$STATUS" -ne 0 ]; then

            ERROR_TEXT=$(cat "$RUNNER_TEMP/launch-error.txt")

            echo ""
            echo "Response Oracle:"
            echo "$ERROR_TEXT"
            echo ""

            if echo "$ERROR_TEXT" | grep -qiE \
              'Out of host capacity|Out of capacity'; then

              echo "========================================"
              echo "STOK A1 BATAM MASIH HABIS"
              echo "========================================"
              echo ""
              echo "Konfigurasi sudah berhasil."
              echo "Workflow akan mencoba lagi otomatis."
              echo ""

              exit 0
            fi

            if echo "$ERROR_TEXT" | grep -qiE \
              'TooManyRequests|429'; then

              echo "Oracle sedang membatasi request."
              echo "Akan dicoba kembali pada jadwal berikutnya."

              exit 0
            fi

            if echo "$ERROR_TEXT" | grep -qi \
              'LimitExceeded'; then

              echo "========================================"
              echo "LIMIT RESOURCE ORACLE TERCAPAI"
              echo "========================================"

              exit 1
            fi

            if echo "$ERROR_TEXT" | grep -qi \
              'InvalidParameter'; then

              echo "========================================"
              echo "PARAMETER INSTANCE TIDAK VALID"
              echo "========================================"

              exit 1
            fi

            if echo "$ERROR_TEXT" | grep -qi \
              'NotAuthorizedOrNotFound'; then

              echo "========================================"
              echo "RESOURCE LAUNCH TIDAK DITEMUKAN / TIDAK DIAKSES"
              echo "Subnet dan image sudah divalidasi."
              echo "Lihat Response Oracle di atas."
              echo "========================================"

              exit 1
            fi

            echo "========================================"
            echo "ERROR LAIN DARI ORACLE"
            echo "========================================"

            exit "$STATUS"
          fi

          # ========================================================
          # BERHASIL
          # ========================================================

          echo ""
          echo "========================================"
          echo "SERVER BERHASIL DIBUAT!"
          echo "========================================"

          INSTANCE_ID=$(
            "$OCI" compute instance list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --region "$OCI_REGION" \
              --display-name "$NAME" \
              --query 'data[0].id' \
              --raw-output
          )

          if [ -z "$INSTANCE_ID" ] || \
             [ "$INSTANCE_ID" = "null" ]; then

            echo "Instance berhasil dibuat tetapi OCID tidak ditemukan."
            exit 1
          fi

          echo "Instance OCID ditemukan."

          VNIC_ID=$(
            "$OCI" compute vnic-attachment list \
              --compartment-id "$OCI_TENANCY_OCID" \
              --instance-id "$INSTANCE_ID" \
              --query 'data[0]."vnic-id"' \
              --raw-output
          )

          PUBLIC_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --query 'data."public-ip"' \
              --raw-output
          )

          PRIVATE_IP=$(
            "$OCI" network vnic get \
              --vnic-id "$VNIC_ID" \
              --query 'data."private-ip"' \
              --raw-output
          )

          echo ""
          echo "========================================"
          echo "ORACLE A1 BERHASIL RUNNING"
          echo "========================================"
          echo "Instance   : $NAME"
          echo "Image      : $IMAGE_NAME"
          echo "Shape      : $OCI_SHAPE"
          echo "OCPU       : $OCI_OCPUS"
          echo "RAM        : $OCI_MEMORY_GB GB"
          echo "Private IP : $PRIVATE_IP"
          echo "Public IP  : $PUBLIC_IP"
          echo "========================================"
