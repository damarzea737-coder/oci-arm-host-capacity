      - name: Validate OCI API Key Pair
        env:
          EXPECTED_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          ACTUAL=$(openssl rsa -pubout -outform DER \
            -in "$GITHUB_WORKSPACE/private_key.pem" 2>/dev/null \
            | openssl md5 -c \
            | sed 's/^.*= //' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          EXPECTED=$(printf '%s' "$EXPECTED_FINGERPRINT" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')

          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "OK: Private key matches OCI fingerprint."
          else
            echo "ERROR: OCI_KEY_CONTENT does NOT match OCI_FINGERPRINT."
            exit 1
          fi
