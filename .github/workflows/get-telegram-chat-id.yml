name: Telegram Oracle Report

on:
  workflow_run:
    workflows: ["Oracle A1 Auto Provision"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Download Oracle Logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/oracle-logs"

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/oracle-logs.zip"

          unzip -q \
            "$RUNNER_TEMP/oracle-logs.zip" \
            -d "$RUNNER_TEMP/oracle-logs"

          : > "$RUNNER_TEMP/oracle-all.log"

          while IFS= read -r -d '' FILE; do
            cat "$FILE" >> "$RUNNER_TEMP/oracle-all.log"
            printf '\n' >> "$RUNNER_TEMP/oracle-all.log"
          done < <(
            find "$RUNNER_TEMP/oracle-logs" \
              -type f \
              -name '*.txt' \
              -print0
          )

          sed -r \
            's/\x1B\[[0-9;]*[mK]//g' \
            "$RUNNER_TEMP/oracle-all.log" \
            | tr -d '\r' \
            > "$RUNNER_TEMP/oracle-clean.log"

      - name: Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -e

          LOG="$RUNNER_TEMP/oracle-clean.log"

          send_telegram() {
            curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              >/dev/null
          }

          # ========================================
          # SERVER BARU BERHASIL
          # ========================================

          if grep -qE \
            'Z ORACLE A1 BERHASIL RUNNING$' "$LOG"; then

            INSTANCE=$(
              grep -E \
                'Z Instance[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Instance[[:space:]]+:[[:space:]]*//'
            )

            PUBLIC_IP=$(
              grep -E \
                'Z Public IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Public IP[[:space:]]+:[[:space:]]*//'
            )

            PRIVATE_IP=$(
              grep -E \
                'Z Private IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Private IP[[:space:]]+:[[:space:]]*//'
            )

            MESSAGE="🎉 ORACLE A1 BERHASIL!

Percobaan workflow: #${RUN_NUMBER}

Region: Batam
Shape: VM.Standard.A1.Flex
CPU: 1 OCPU
RAM: 6 GB

Instance:
${INSTANCE:-berhasil dibuat}

Public IP:
${PUBLIC_IP:-belum tersedia}

Private IP:
${PRIVATE_IP:-belum tersedia}

✅ Pencarian A1 selesai."

            send_telegram "$MESSAGE"

            exit 0
          fi

          # ========================================
          # A1 SUDAH ADA
          # Jangan spam Telegram lagi
          # ========================================

          if grep -qE \
            'Z A1 SUDAH ADA$' "$LOG"; then

            echo "A1 sudah ada."
            echo "Tidak mengirim laporan berulang."

            exit 0
          fi

          # ========================================
          # ERROR SERIUS -> LANGSUNG TELEGRAM
          # ========================================

          if [ "$RUN_CONCLUSION" != "success" ]; then

            MESSAGE="❌ ORACLE A1 WORKFLOW ERROR

Percobaan workflow: #${RUN_NUMBER}

Status GitHub:
${RUN_CONCLUSION}

Oracle dijadwalkan mencoba setiap 10 menit.

Workflow perlu diperiksa."

            send_telegram "$MESSAGE"

            exit 0
          fi

          # ========================================
          # LAPORAN RUTIN
          # Setiap 3 run = sekitar 30 menit
          # ========================================

          REMAINDER=$((RUN_NUMBER % 3))

          if [ "$REMAINDER" -ne 0 ]; then
            echo "Belum jadwal laporan Telegram."
            exit 0
          fi

          # ========================================
          # TENTUKAN STATUS
          # ========================================

          if grep -qE \
            'Z ORACLE RATE LIMIT$' "$LOG"; then

            STATUS="⏳ Oracle sedang rate limit (429).
A1 belum didapat."

          elif grep -qE \
            'Z STOK A1 BATAM MASIH HABIS$' "$LOG"; then

            STATUS="⏳ Kapasitas A1 Batam masih habis."

          elif grep -qE \
            'Z KONEKSI TIMEOUT$' "$LOG"; then

            STATUS="⚠️ Koneksi Oracle sempat timeout.
A1 belum terdeteksi."

          elif grep -qE \
            'Z BELUM ADA A1$' "$LOG"; then

            STATUS="🔄 A1 belum didapat.
Pencarian masih berjalan."

          else

            STATUS="🔄 Percobaan selesai.
A1 belum terdeteksi berhasil dibuat."

          fi

          MESSAGE="🤖 ORACLE A1 MONITOR

Percobaan workflow: #${RUN_NUMBER}

${STATUS}

⏱ Percobaan Oracle:
setiap 10 menit

📨 Laporan Telegram:
setiap ±30 menit

Region: Batam
Shape: VM.Standard.A1.Flex
Target: 1 OCPU / 6 GB

Bot akan memberi tahu langsung jika A1 berhasil."

          send_telegram "$MESSAGE"

          echo "Telegram report sent."
