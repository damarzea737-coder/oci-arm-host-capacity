name: Telegram Oracle Report

on:
  workflow_run:
    workflows:
      - Oracle A1 Auto Provision
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  telegram-report:
    runs-on: ubuntu-latest

    steps:
      - name: Get Oracle Log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/logs"
          echo "Mengambil log Oracle run #${RUN_ID}..."

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/logs.zip"

          unzip -q "$RUNNER_TEMP/logs.zip" -d "$RUNNER_TEMP/logs"

          : > "$RUNNER_TEMP/oracle.log"

          find "$RUNNER_TEMP/logs" \
            -type f \
            -name "*.txt" \
            -exec cat {} \; \
            >> "$RUNNER_TEMP/oracle.log"

          echo "Log Oracle berhasil diambil."

      - name: Send Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -e

          LOG="$RUNNER_TEMP/oracle.log"
          NOW_WIB=$(TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M WIB')

          send_message() {
            TEXT="$1"

            if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "ERROR: TELEGRAM_BOT_TOKEN kosong."
              exit 1
            fi

            if [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "ERROR: TELEGRAM_CHAT_ID kosong."
              exit 1
            fi

            REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
            KEYBOARD=$(printf '{"inline_keyboard":[[{"text":"⚙️ GitHub Actions","url":"%s"}],[{"text":"📦 Repository","url":"%s"}]]}' "$RUN_URL" "$REPO_URL")

            if ! curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              --data-urlencode "reply_markup=${KEYBOARD}" \
              >/dev/null
            then
              echo "WARNING: Gagal mengirim Telegram."
              return 1
            fi

            echo "Telegram berhasil dikirim."
          }

          # A1 BARU BERHASIL RUNNING
          if grep -qE 'Z ORACLE A1 BERHASIL RUNNING$' "$LOG"; then

            INSTANCE=$(
              grep -E 'Z Instance[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E 's/^.*Z Instance[[:space:]]+:[[:space:]]*//'
            )

            PUBLIC_IP=$(
              grep -E 'Z Public IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E 's/^.*Z Public IP[[:space:]]+:[[:space:]]*//'
            )

            PRIVATE_IP=$(
              grep -E 'Z Private IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E 's/^.*Z Private IP[[:space:]]+:[[:space:]]*//'
            )

            [ -z "$INSTANCE" ] && INSTANCE="berhasil dibuat"
            [ -z "$PUBLIC_IP" ] && PUBLIC_IP="belum tersedia"
            [ -z "$PRIVATE_IP" ] && PRIVATE_IP="belum tersedia"

            MSG=$(printf '%s\n' \
              "🎉 ORACLE A1 BERHASIL!" \
              "" \
              "🔢 Percobaan: #${RUN_NUMBER}" \
              "🕒 ${NOW_WIB}" \
              "" \
              "🟢 GitHub Actions: NORMAL" \
              "🟢 Oracle Server: RUNNING" \
              "" \
              "🌏 Region: Batam" \
              "🖥 Shape: VM.Standard.A1.Flex" \
              "⚙️ CPU: 1 OCPU" \
              "💾 RAM: 6 GB" \
              "" \
              "📛 Instance:" \
              "${INSTANCE}" \
              "" \
              "🌐 Public IP:" \
              "${PUBLIC_IP}" \
              "" \
              "🔒 Private IP:" \
              "${PRIVATE_IP}" \
              "" \
              "✅ Server berhasil dibuat dan sudah RUNNING." \
              "✅ Bot tidak akan membuat instance kedua."
            )

            send_message "$MSG" || true
            exit 0
          fi

          # A1 SUDAH ADA: jangan spam setelah berhasil
          if grep -qE 'Z A1 SUDAH ADA$' "$LOG"; then
            echo "A1 sudah ada."
            echo "Tidak mengirim laporan percobaan lagi."
            exit 0
          fi

          # ERROR WORKFLOW SERIUS
          if [ "$RUN_RESULT" != "success" ]; then

            MSG=$(printf '%s\n' \
              "❌ ORACLE A1 WORKFLOW ERROR" \
              "" \
              "🔢 Percobaan: #${RUN_NUMBER}" \
              "🕒 ${NOW_WIB}" \
              "" \
              "🔴 GitHub Actions: ${RUN_RESULT}" \
              "⚠️ Workflow Oracle mengalami error." \
              "" \
              "Tekan tombol GitHub Actions di bawah untuk melihat run."
            )

            send_message "$MSG" || true
            exit 0
          fi

          # LAPORAN SETIAP PERCOBAAN
          STATUS="A1 belum berhasil didapat."
          ORACLE_ICON="🟡"

          if grep -qE 'Z ORACLE RATE LIMIT$' "$LOG"; then
            STATUS="Oracle sedang rate limit (429 / TooManyRequests)."
            ORACLE_ICON="🟠"

          elif grep -qE 'Z STOK A1 BATAM MASIH HABIS$' "$LOG"; then
            STATUS="Kapasitas Oracle A1 Batam masih habis."
            ORACLE_ICON="🟡"

          elif grep -qE 'Z KONEKSI TIMEOUT$' "$LOG"; then
            STATUS="Koneksi ke Oracle sempat timeout."
            ORACLE_ICON="🟠"

          elif grep -qE 'Z BELUM ADA A1$' "$LOG"; then
            STATUS="A1 belum didapat. Pencarian masih berjalan."
            ORACLE_ICON="🟡"
          fi

          MSG=$(printf '%s\n' \
            "🤖 ORACLE A1 MONITOR" \
            "" \
            "🔢 Percobaan: #${RUN_NUMBER}" \
            "🕒 ${NOW_WIB}" \
            "" \
            "🟢 GitHub Actions: AKTIF / NORMAL" \
            "${ORACLE_ICON} Oracle A1: BELUM DIDAPAT" \
            "" \
            "📋 Hasil percobaan:" \
            "${STATUS}" \
            "" \
            "🌏 Region: Batam" \
            "🖥 Shape: VM.Standard.A1.Flex" \
            "⚙️ Target: 1 OCPU" \
            "💾 RAM: 6 GB" \
            "💿 Boot: 50 GB" \
            "" \
            "⏱ Target percobaan: setiap 10 menit" \
            "📨 Telegram: setiap selesai percobaan" \
            "" \
            "Bot akan langsung memberi tahu jika A1 berhasil."
          )

          send_message "$MSG" || true
          echo "Laporan Oracle #${RUN_NUMBER} selesai."
