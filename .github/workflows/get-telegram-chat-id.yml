name: Telegram Oracle Report

on:
  workflow_run:
    workflows:
      - Oracle A1 Auto Provision
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  telegram-report:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. AMBIL LOG WORKFLOW ORACLE
      # ============================================================

      - name: Get Oracle Log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/logs"

          echo "Mengambil log Oracle run #${RUN_ID}..."

          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/logs.zip"

          unzip -q \
            "$RUNNER_TEMP/logs.zip" \
            -d "$RUNNER_TEMP/logs"

          : > "$RUNNER_TEMP/oracle.log"

          find "$RUNNER_TEMP/logs" \
            -type f \
            -name "*.txt" \
            -exec cat {} \; \
            >> "$RUNNER_TEMP/oracle.log"

          echo "Log Oracle berhasil diambil."

      # ============================================================
      # 2. ANALISIS + KIRIM TELEGRAM
      # ============================================================

      - name: Send Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -e

          LOG="$RUNNER_TEMP/oracle.log"

          # --------------------------------------------------------
          # FUNGSI KIRIM TELEGRAM
          # --------------------------------------------------------

          send_message() {

            if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "ERROR: TELEGRAM_BOT_TOKEN kosong."
              exit 1
            fi

            if [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "ERROR: TELEGRAM_CHAT_ID kosong."
              exit 1
            fi

            if ! curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              >/dev/null
            then
              echo "WARNING: Gagal mengirim Telegram."
              return 1
            fi

            echo "Telegram berhasil dikirim."
          }

          # ========================================================
          # 3. JIKA SERVER A1 BARU BERHASIL RUNNING
          # KIRIM LANGSUNG, TIDAK MENUNGGU 30 MENIT
          # ========================================================

          if grep -qE \
            'Z ORACLE A1 BERHASIL RUNNING$' "$LOG"
          then

            INSTANCE=$(
              grep -E \
                'Z Instance[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Instance[[:space:]]+:[[:space:]]*//'
            )

            PUBLIC_IP=$(
              grep -E \
                'Z Public IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Public IP[[:space:]]+:[[:space:]]*//'
            )

            PRIVATE_IP=$(
              grep -E \
                'Z Private IP[[:space:]]+:' "$LOG" \
              | tail -1 \
              | sed -E \
                's/^.*Z Private IP[[:space:]]+:[[:space:]]*//'
            )

            if [ -z "$INSTANCE" ]; then
              INSTANCE="berhasil dibuat"
            fi

            if [ -z "$PUBLIC_IP" ]; then
              PUBLIC_IP="belum tersedia"
            fi

            if [ -z "$PRIVATE_IP" ]; then
              PRIVATE_IP="belum tersedia"
            fi

            MSG=$(printf '%s\n' \
              "🎉 ORACLE A1 BERHASIL!" \
              "" \
              "Percobaan workflow: #${RUN_NUMBER}" \
              "" \
              "🌏 Region: Batam" \
              "🖥 Shape: VM.Standard.A1.Flex" \
              "⚙️ CPU: 1 OCPU" \
              "💾 RAM: 6 GB" \
              "" \
              "📛 Instance:" \
              "${INSTANCE}" \
              "" \
              "🌐 Public IP:" \
              "${PUBLIC_IP}" \
              "" \
              "🔒 Private IP:" \
              "${PRIVATE_IP}" \
              "" \
              "✅ Server sudah RUNNING." \
              "✅ Pencarian A1 berhasil."
            )

            send_message "$MSG" || true

            echo "A1 berhasil. Notifikasi sukses selesai."

            exit 0
          fi

          # ========================================================
          # 4. JIKA A1 SUDAH ADA
          # JANGAN KIRIM PESAN BERULANG SETIAP 10 MENIT
          # ========================================================

          if grep -qE \
            'Z A1 SUDAH ADA$' "$LOG"
          then

            echo "A1 sudah ada."
            echo "Tidak mengirim Telegram lagi agar tidak spam."

            exit 0
          fi

          # ========================================================
          # 5. ERROR SERIUS WORKFLOW
          # KIRIM LANGSUNG
          # ========================================================

          if [ "$RUN_RESULT" != "success" ]; then

            MSG=$(printf '%s\n' \
              "❌ ORACLE A1 WORKFLOW ERROR" \
              "" \
              "Percobaan workflow: #${RUN_NUMBER}" \
              "Status: ${RUN_RESULT}" \
              "" \
              "⚠️ Workflow Oracle mengalami error." \
              "Silakan periksa GitHub Actions."
            )

            send_message "$MSG" || true

            exit 0
          fi

          # ========================================================
          # 6. LAPORAN RUTIN SETIAP 3 PERCOBAAN
          #
          # Oracle target: setiap 10 menit
          # Telegram: setiap ±30 menit
          # ========================================================

          REMAINDER=$((RUN_NUMBER % 3))

          if [ "$REMAINDER" -ne 0 ]; then

            echo "Percobaan #${RUN_NUMBER}"
            echo "Belum jadwal laporan Telegram."
            echo "Laporan rutin dikirim setiap 3 percobaan."

            exit 0
          fi

          # ========================================================
          # 7. DETEKSI KONDISI ORACLE
          # ========================================================

          STATUS="🔄 A1 belum berhasil didapat."

          if grep -qE \
            'Z ORACLE RATE LIMIT$' "$LOG"
          then

            STATUS="⏳ Oracle sedang rate limit (429)."

          elif grep -qE \
            'Z STOK A1 BATAM MASIH HABIS$' "$LOG"
          then

            STATUS="⏳ Kapasitas Oracle A1 Batam masih habis."

          elif grep -qE \
            'Z KONEKSI TIMEOUT$' "$LOG"
          then

            STATUS="⚠️ Koneksi ke Oracle sempat timeout."

          elif grep -qE \
            'Z BELUM ADA A1$' "$LOG"
          then

            STATUS="🔄 A1 belum didapat, pencarian masih berjalan."

          fi

          # ========================================================
          # 8. KIRIM LAPORAN RUTIN
          # ========================================================

          MSG=$(printf '%s\n' \
            "🤖 ORACLE A1 MONITOR" \
            "" \
            "Sudah sampai percobaan: #${RUN_NUMBER}" \
            "" \
            "${STATUS}" \
            "" \
            "⏱ Target percobaan Oracle:" \
            "setiap 10 menit" \
            "" \
            "📨 Laporan Telegram:" \
            "setiap ±30 menit" \
            "" \
            "🌏 Region: Batam" \
            "🖥 Shape: VM.Standard.A1.Flex" \
            "⚙️ Target: 1 OCPU" \
            "💾 RAM: 6 GB" \
            "" \
            "Bot akan langsung memberi tahu jika A1 berhasil."
          )

          send_message "$MSG" || true

          echo "Laporan Oracle #${RUN_NUMBER} selesai."
