name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest

    steps:
      - name: Get Telegram Chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "Mengambil Chat ID Telegram..."

          RESPONSE=$(curl -s \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")

          CHAT_ID=$(echo "$RESPONSE" | jq -r \
            '.result[-1].message.chat.id // empty')

          if [ -z "$CHAT_ID" ]; then
            echo "Chat ID belum ditemukan."
            echo "Kirim pesan HALO ke bot Telegram lalu jalankan lagi."
            exit 1
          fi

          echo "===================================="
          echo "TELEGRAM CHAT ID:"
          echo "$CHAT_ID"
          echo "===================================="
