name: Telegram Oracle Report

on:
  workflow_run:
    workflows:
      - Oracle A1 Auto Provision
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  telegram-report:
    runs-on: ubuntu-latest

    steps:
      - name: Get Oracle Log
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"

          curl -L -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            -o "$RUNNER_TEMP/logs.zip"

          unzip -q "$RUNNER_TEMP/logs.zip" \
            -d "$RUNNER_TEMP/logs"

          find "$RUNNER_TEMP/logs" \
            -type f \
            -name "*.txt" \
            -exec cat {} \; \
            > "$RUNNER_TEMP/oracle.log"

      - name: Send Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          LOG="$RUNNER_TEMP/oracle.log"

          send_message() {
            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$1" \
              >/dev/null
          }

          # SERVER BERHASIL - LANGSUNG KIRIM
          if grep -q "ORACLE A1 BERHASIL RUNNING" "$LOG"; then

            INSTANCE=$(grep "Instance   :" "$LOG" | tail -1 | sed 's/^.*Instance   : //')
            PUBLIC_IP=$(grep "Public IP  :" "$LOG" | tail -1 | sed 's/^.*Public IP  : //')
            PRIVATE_IP=$(grep "Private IP :" "$LOG" | tail -1 | sed 's/^.*Private IP : //')

            MSG=$(printf '%s\n' \
              "🎉 ORACLE A1 BERHASIL!" \
              "" \
              "Percobaan: #${RUN_NUMBER}" \
              "Region: Batam" \
              "Shape: VM.Standard.A1.Flex" \
              "CPU: 1 OCPU" \
              "RAM: 6 GB" \
              "" \
              "Instance: ${INSTANCE}" \
              "Public IP: ${PUBLIC_IP}" \
              "Private IP: ${PRIVATE_IP}" \
              "" \
              "✅ Server sudah RUNNING.")

            send_message "$MSG"
            exit 0
          fi

          # KALAU A1 SUDAH ADA, JANGAN SPAM
          if grep -q "A1 SUDAH ADA" "$LOG"; then
            echo "A1 sudah ada. Telegram tidak dikirim lagi."
            exit 0
          fi

          # ERROR SERIUS LANGSUNG KIRIM
          if [ "$RUN_RESULT" != "success" ]; then

            MSG=$(printf '%s\n' \
              "❌ ORACLE WORKFLOW ERROR" \
              "" \
              "Percobaan: #${RUN_NUMBER}" \
              "Status: ${RUN_RESULT}" \
              "" \
              "Workflow perlu diperiksa.")

            send_message "$MSG"
            exit 0
          fi

          # LAPORAN CUMA SETIAP 3 PERCOBAAN
          # kira-kira setiap 30 menit
          if [ $((RUN_NUMBER % 3)) -ne 0 ]; then
            echo "Belum waktunya laporan Telegram."
            exit 0
          fi

          STATUS="🔄 A1 belum didapat."

          if grep -q "ORACLE RATE LIMIT" "$LOG"; then
            STATUS="⏳ Oracle rate limit 429."
          elif grep -q "STOK A1 BATAM MASIH HABIS" "$LOG"; then
            STATUS="⏳ Kapasitas A1 Batam masih habis."
          elif grep -q "KONEKSI TIMEOUT" "$LOG"; then
            STATUS="⚠️ Koneksi Oracle timeout."
          fi

          MSG=$(printf '%s\n' \
            "🤖 ORACLE A1 MONITOR" \
            "" \
            "Sudah sampai percobaan: #${RUN_NUMBER}" \
            "${STATUS}" \
            "" \
            "Target percobaan: setiap 10 menit" \
            "Laporan Telegram: setiap ±30 menit" \
            "" \
            "Region: Batam" \
            "Target: 1 OCPU / 6 GB" \
            "" \
            "Bot akan langsung memberi tahu kalau A1 berhasil.")

          send_message "$MSG"
